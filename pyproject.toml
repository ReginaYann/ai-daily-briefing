[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-daily-briefing"
version = "0.1.0"
description = "Personal daily AI briefing: collect, filter, summarize, render."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yan Lijun" }]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "feedparser>=6.0.11",
    "arxiv>=2.1.0",
    "beautifulsoup4>=4.12.3",
    "praw>=7.7.1",
    "sqlite-utils>=3.36",
    "jinja2>=3.1.4",
    "structlog>=24.1.0",
    "anthropic>=0.39.0",
    "openai>=1.40.0",
    "ollama>=0.3.0",
    "jsonschema>=4.22.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
    "ruff>=0.5.0",
]

[project.scripts]
briefing = "briefing.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefing = ["renderer/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
